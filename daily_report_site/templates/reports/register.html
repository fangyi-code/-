{% extends "base.html" %}
{% block title %}注册{% endblock %}
{% block content %}
<div class="panel narrow">
  <h1>注册</h1>
  <form method="post" class="stack-form">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">创建账号</button>
  </form>
  <p>已有账号？<a href="{% url 'login' %}">登录</a></p>
</div>
{% endblock %}
