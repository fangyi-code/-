{% extends "base.html" %}
{% block title %}登录{% endblock %}
{% block content %}
<div class="panel narrow">
  <h1>登录</h1>
  <form method="post" class="stack-form">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">登录</button>
  </form>
  <p>没有账号？<a href="{% url 'register' %}">注册</a></p>
</div>
{% endblock %}
